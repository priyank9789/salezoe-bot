name: SALEZOE deal post
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      # --loop (a post every 20 min for ~5.5 h per run) only when the repo is public: private repos get just 2000 free Actions minutes/month
      - run: python3 salezoe_bot.py ${{ github.event.repository.private == false && '--loop' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@SALEZOE"
      - name: remember what was posted
        if: always()
        run: |
          git config user.name salezoe-bot
          git config user.email bot@salezoe.com
          git add posted.json
          git diff --cached --quiet || (git commit -qm "posted $(date -u +%FT%TZ)" && git push -q)
