name: SALEZOE deal post
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: post every 30 min for ~5.5 h
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@SALEZOE"
        run: |
          git config user.name salezoe-bot
          git config user.email bot@salezoe.com
          for i in $(seq 1 11); do
            git pull -q --rebase || true
            python3 salezoe_bot.py
            git add posted.json
            git diff --cached --quiet || (git commit -qm "posted $(date -u +%FT%TZ)" && git push -q)
            [ "$i" -lt 11 ] && sleep 1800
          done
      - name: start the next 5.5 h block
        if: always()
        run: |
          curl -s -o /dev/null -w "dispatch %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/post.yml/dispatches \
            -d '{"ref":"main"}'
