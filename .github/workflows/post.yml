name: SALEZOE deal post
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - run: python3 salezoe_bot.py --loop
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@SALEZOE"
      - name: remember what was posted
        if: always()
        run: |
          git config user.name salezoe-bot
          git config user.email bot@salezoe.com
          git add posted.json
          git diff --cached --quiet || (git commit -qm "posted $(date -u +%FT%TZ)" && git push -q)
