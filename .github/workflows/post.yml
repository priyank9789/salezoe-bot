name: SALEZOE deal post
on:
  schedule:
    - cron: "*/10 * * * *"     # checks every 10 min; the script's daily cap and 4h gap decide whether it posts
  workflow_dispatch:           # the "one tap" — Actions tab → Run workflow, from phone or laptop
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 salezoe_bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@SALEZOE"
      - name: remember what was posted
        run: |
          git config user.name salezoe-bot
          git config user.email bot@salezoe.com
          git add posted.json
          git diff --cached --quiet || git commit -m "posted $(date -u +%FT%TZ)" && git push
# schedule re-registered 2 Sept 2026
